# render.yaml — configuración para publicar en Render con un clic (Blueprint).
# Render lee este archivo al conectar el repositorio de GitHub.
services:
  - type: web
    name: turnos-pymes
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit # cada push a GitHub vuelve a publicar
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: America/Argentina/Buenos_Aires
      - key: NEGOCIO_NOMBRE
        value: Turnos Demo
      - key: HORA_APERTURA
        value: "09:00"
      - key: HORA_CIERRE
        value: "18:00"
      - key: DURACION_TURNO_MIN
        value: "30"
      - key: DIAS_LABORABLES
        value: "1,2,3,4,5,6"
      # Render genera un secreto aleatorio para firmar las sesiones
      - key: SESSION_SECRET
        generateValue: true
      # Estos tres los pide Render al crear el servicio (no se guardan en el repo)
      - key: MONGODB_URI
        sync: mongodb+srv://lucianocontrerasestudio04_db_user:vNpAqzLp6UA6tR1I@lucianodemian04.hdxmkim.mongodb.net/turnos_pymes?retryWrites=true&w=majority
      - key: ADMIN_USER
        sync: adminturnosdemo
      - key: ADMIN_PASSWORD_HASH
        sync: scrypt$4607bfacb80805e2891d70a8cdc06ea6$4eb7f262458ca998ff8a50b643d976a6dedf4b26248f8a41d968fea4f3a99a1386cdcfabad7f18ec753dbd5f9e73a5f82af03a1428b8bcb2fd3f420448449037
