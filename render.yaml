# render.yaml — configuración para publicar en Render con un clic (Blueprint).
# Render lee este archivo al conectar el repositorio de GitHub.
services:
  - type: web
    name: turnos-pymes
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit # cada push a GitHub vuelve a publicar
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: America/Argentina/Buenos_Aires
      - key: NEGOCIO_NOMBRE
        value: Turnos Demo
      - key: HORA_APERTURA
        value: "09:00"
      - key: HORA_CIERRE
        value: "18:00"
      - key: DURACION_TURNO_MIN
        value: "30"
      - key: DIAS_LABORABLES
        value: "1,2,3,4,5,6"
      # Render genera un secreto aleatorio para firmar las sesiones
      - key: SESSION_SECRET
        generateValue: true
      # Estos tres los pide Render al crear el servicio (no se guardan en el repo)
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
