<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de turnos</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <main class="container container-wide">
    <header class="brand header-row">
      <div>
        <span class="logo">Administración</span>
        <h1>Panel de turnos</h1>
        <p>Gestioná las reservas: marcá como completadas, cancelá o eliminá.</p>
      </div>
      <div class="session">
        <span>👤 <strong id="admin-usuario">admin</strong></span>
        <button type="button" id="btn-logout" class="btn btn-sm btn-ghost">Cerrar sesión</button>
      </div>
    </header>

    <section class="stats" aria-label="Resumen">
      <div class="stat"><div class="n" id="st-total">0</div><div class="t">Turnos listados</div></div>
      <div class="stat"><div class="n" id="st-pend">0</div><div class="t">Pendientes</div></div>
      <div class="stat"><div class="n" id="st-comp">0</div><div class="t">Completados</div></div>
      <div class="stat"><div class="n" id="st-canc">0</div><div class="t">Cancelados</div></div>
    </section>

    <section class="card">
      <form id="filtros" class="toolbar">
        <div class="field">
          <label for="f-fecha">Fecha</label>
          <input type="date" id="f-fecha" />
        </div>
        <div class="field">
          <label for="f-estado">Estado</label>
          <select id="f-estado">
            <option value="">Todos</option>
            <option>Pendiente</option>
            <option>Completado</option>
            <option>Cancelado</option>
          </select>
        </div>
        <div class="field">
          <label for="f-q">Buscar</label>
          <input type="search" id="f-q" placeholder="Nombre o WhatsApp" />
        </div>
        <button type="button" id="btn-hoy" class="btn btn-ghost">Hoy</button>
        <button type="button" id="btn-limpiar" class="btn btn-ghost">Limpiar</button>
      </form>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Hora</th>
              <th>Cliente</th>
              <th>WhatsApp</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-turnos">
            <tr><td colspan="6" class="empty">Cargando…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <p class="footer-link"><a href="/">← Volver a la página de reservas</a></p>
  </main>

  <div id="toast" class="toast" role="status"></div>

  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
